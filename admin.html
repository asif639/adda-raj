
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#244c36">
<title>আড্ডা রাজ | অ্যাডমিন</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5ef;color:#24352a;font-family:Arial,sans-serif}
header{background:#244c36;color:white;text-align:center;padding:22px 12px}
header h2{margin:0 0 7px}
header p{margin:0;font-size:14px}
main{max-width:850px;margin:20px auto;padding:0 12px}
.card{background:white;padding:16px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 10px #0000000a}
h3{margin-top:0}
input,button,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccd5cb;border-radius:8px;font-size:15px}
button{background:#244c36;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.hidden{display:none!important}
.notice{padding:12px;border-radius:8px;margin-bottom:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.error{background:#ffeded;color:#922}
.success{background:#e6f5e8;color:#245c2b}
.order{border:1px solid #dce4db;border-radius:10px;padding:14px;margin:12px 0}
.order h4{margin:0 0 8px}
.details{font-size:14px;line-height:1.8;overflow-wrap:anywhere}
.muted{color:#637267;font-size:12px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
@media(max-width:450px){.row{flex-direction:column}}
</style>
</head>

<body>
<header>
  <h2>আড্ডা রাজ</h2>
  <p>অ্যাডমিন প্যানেল · অর্ডার ব্যবস্থাপনা</p>
</header>

<main>
  <div id="notice" class="notice hidden"></div>

  <section id="loginCard" class="card">
    <h3>অ্যাডমিন লগইন</h3>
    <form id="loginForm">
      <label for="email">ইমেইল</label>
      <input id="email" type="email" autocomplete="username"
        placeholder="অ্যাডমিন ইমেইল" required>

      <label for="password">পাসওয়ার্ড</label>
      <input id="password" type="password"
        autocomplete="current-password" placeholder="পাসওয়ার্ড" required>

      <button id="loginBtn" type="submit">লগইন করো</button>
    </form>
  </section>

  <section id="dashboard" class="hidden">
    <div class="card">
      <div class="row">
        <button id="refreshBtn" type="button">অর্ডার রিফ্রেশ</button>
        <button id="logoutBtn" type="button">লগআউট</button>
      </div>
      <p id="summary">অর্ডার লোড হচ্ছে...</p>
    </div>

    <div class="card">
      <h3>সব অর্ডার</h3>
      <div id="orders">লোড হচ্ছে...</div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://aidqolykizqvgqekgkch.supabase.co";
const SUPABASE_KEY = "sb_publishable_-1Lacx4HBZLhN9xv3i4zgg_jH9QYB90";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);
let busy = false;

const statusOptions = [
  ["pending", "নতুন অর্ডার"],
  ["accepted", "অর্ডার গ্রহণ করা হয়েছে"],
  ["preparing", "তৈরি হচ্ছে"],
  ["ready", "পরিবেশনের জন্য প্রস্তুত"],
  ["completed", "সম্পন্ন"],
  ["cancelled", "বাতিল"]
];

function message(text, type="error") {
  $("notice").textContent = text;
  $("notice").className = "notice " + type;
}

function clearMessage() {
  $("notice").textContent = "";
  $("notice").className = "notice hidden";
}

function showLogin() {
  $("loginCard").classList.remove("hidden");
  $("dashboard").classList.add("hidden");
}

function showDashboard() {
  $("loginCard").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[ch]);
}

function getField(row, names) {
  for (const name of names) {
    if (Object.prototype.hasOwnProperty.call(row, name)) {
      return row[name];
    }
  }
  return null;
}

function statusLabel(value) {
  const found = statusOptions.find(item => item[0] === value);
  return found ? found[1] : (value || "অজানা");
}

async function checkAdmin() {
  const {data: sessionData, error: sessionError} =
    await db.auth.getSession();

  if (sessionError) throw sessionError;

  if (!sessionData.session) {
    showLogin();
    return false;
  }

  const {data, error} = await db.rpc("is_cafe_admin");

  if (error) {
    throw new Error("অ্যাডমিন অনুমতি যাচাই করা যায়নি: " + error.message);
  }

  if (data !== true) {
    await db.auth.signOut();
    showLogin();
    throw new Error("এই অ্যাকাউন্ট অ্যাডমিন হিসেবে অনুমোদিত নয়।");
  }

  showDashboard();
  return true;
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  clearMessage();

  const btn = $("loginBtn");
  btn.disabled = true;
  btn.textContent = "লগইন হচ্ছে...";

  try {
    const {error} = await db.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });

    if (error) throw error;

    const allowed = await checkAdmin();
    if (allowed) await loadOrders();
  } catch (error) {
    message(error.message || "লগইন করা যায়নি।");
  } finally {
    btn.disabled = false;
    btn.textContent = "লগইন করো";
  }
});

async function loadOrders() {
  if (busy) return;
  busy = true;
  clearMessage();

  $("orders").textContent = "অর্ডার লোড হচ্ছে...";
  $("summary").textContent = "অপেক্ষা করো...";

  try {
    const allowed = await checkAdmin();
    if (!allowed) return;

    // সব কলাম আনা হচ্ছে, তাই কলামের নাম আগে থেকে অনুমান করতে হচ্ছে না।
    const {data, error} = await db
      .from("orders")
      .select("*")
      .limit(100);

    if (error) throw error;

    const orders = data || [];

    // ডাটাবেসে তারিখের কলামের নাম যেভাবেই থাকুক, সেটি খুঁজে নেবে।
    orders.sort((a, b) => {
      const dateA = getField(a, ["created_at", "created at"]);
      const dateB = getField(b, ["created_at", "created at"]);
      const timeA = dateA ? new Date(dateA).getTime() : 0;
      const timeB = dateB ? new Date(dateB).getTime() : 0;

      if (timeA && timeB) return timeB - timeA;
      return Number(b.id || 0) - Number(a.id || 0);
    });

    $("summary").textContent = "মোট দেখানো অর্ডার: " + orders.length;

    if (!orders.length) {
      $("orders").textContent = "এখনো কোনো অর্ডার পাওয়া যায়নি।";
      return;
    }

    $("orders").innerHTML = orders.map(order => {
      const table = getField(order, ["table_number", "table number"]);
      const customer = getField(order, [
        "customer_nam", "customer nam", "customer_name", "customer name"
      ]);
      const created = getField(order, ["created_at", "created at"]);
      const date = created && !isNaN(new Date(created).getTime())
        ? new Date(created).toLocaleString("bn-BD")
        : "সময় পাওয়া যায়নি";

      const options = statusOptions.map(([value, label]) =>
        `<option value="${value}" ${
          order.status === value ? "selected" : ""
        }>${label}</option>`
      ).join("");

      return `
        <article class="order">
          <h4>অর্ডার #${escapeHTML(order.id)}</h4>
          <div class="details">
            <div><b>টেবিল:</b> ${escapeHTML(table ?? "—")}</div>
            <div><b>কাস্টমার:</b> ${escapeHTML(customer || "নাম দেওয়া হয়নি")}</div>
            <div><b>মোট:</b> ৳${escapeHTML(order.total ?? 0)}</div>
            <div><b>বর্তমান স্ট্যাটাস:</b> ${escapeHTML(statusLabel(order.status))}</div>
            <div><b>নোট:</b> ${escapeHTML(order.note || "নেই")}</div>
            <div class="muted">${escapeHTML(date)}</div>
          </div>
          <label for="status-${escapeHTML(order.id)}">স্ট্যাটাস পরিবর্তন</label>
          <select id="status-${escapeHTML(order.id)}">${options}</select>
          <button type="button"
            data-order-id="${escapeHTML(order.id)}"
            class="saveStatus">স্ট্যাটাস সেভ করো</button>
        </article>
      `;
    }).join("");

  } catch (error) {
    $("orders").textContent = "অর্ডার লোড করা যায়নি।";
    message(error.message || "একটি সমস্যা হয়েছে।");
  } finally {
    busy = false;
  }
}

$("orders").addEventListener("click", async event => {
  const btn = event.target.closest(".saveStatus");
  if (!btn) return;

  clearMessage();

  const id = btn.dataset.orderId;
  const select = $("status-" + id);
  const newStatus = select.value;

  btn.disabled = true;
  btn.textContent = "সেভ হচ্ছে...";

  try {
    const allowed = await checkAdmin();
    if (!allowed) return;

    const {data, error} = await db
      .from("orders")
      .update({status: newStatus})
      .eq("id", id)
      .select("id");

    if (error) throw error;

    if (!data || data.length === 0) {
      throw new Error(
        "স্ট্যাটাস সেভ হয়নি। অ্যাডমিন অনুমতি ও RLS নীতি পরীক্ষা করো।"
      );
    }

    message("অর্ডার #" + id + "-এর স্ট্যাটাস সেভ হয়েছে।", "success");
    await loadOrders();

  } catch (error) {
    message(error.message || "স্ট্যাটাস সেভ করা যায়নি।");
  } finally {
    btn.disabled = false;
    btn.textContent = "স্ট্যাটাস সেভ করো";
  }
});

$("refreshBtn").addEventListener("click", loadOrders);

$("logoutBtn").addEventListener("click", async () => {
  const {error} = await db.auth.signOut();

  if (error) {
    message("লগআউট করা যায়নি: " + error.message);
    return;
  }

  showLogin();
  $("orders").innerHTML = "";
  clearMessage();
  message("লগআউট হয়েছে।", "success");
});

(async function init() {
  try {
    const allowed = await checkAdmin();
    if (allowed) await loadOrders();
  } catch (error) {
    showLogin();
    message(error.message || "প্যানেল চালু করা যায়নি।");
  }
})();
</script>
</body>
</html>
