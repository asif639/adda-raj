<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#244c36">
<title>আড্ডা রাজ | ক্যাফে</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f4eb;color:#26372b;font-family:Arial,sans-serif}
header{background:#244c36;color:white;padding:22px 16px;text-align:center}
.logo{font-size:36px}
header h1{margin:5px;font-size:28px}
header p{margin:7px 0 0;color:#e5dfc7}
.hero{margin:14px;padding:22px 16px;border-radius:18px;background:#e7eadb}
.hero h2{margin:0 0 8px;font-size:24px}
.hero p{line-height:1.7;margin:0}
.section{padding:5px 14px 90px}
.section h2{font-size:22px}
.categories{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}
.chip{border:1px solid #244c36;border-radius:20px;padding:9px 15px;white-space:nowrap;background:white;color:#244c36}
.chip.active{background:#244c36;color:white}
.item{display:flex;align-items:center;gap:12px;background:white;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0000000b}
.food{font-size:36px;background:#f0eee4;border-radius:12px;width:65px;height:65px;display:grid;place-items:center;flex-shrink:0}
.details{flex:1}
.details h3{margin:0 0 5px;font-size:17px}
.details p{margin:0 0 7px;font-size:13px;color:#69756b}
.price{font-weight:bold;color:#244c36}
.add{border:0;background:#244c36;color:white;border-radius:10px;padding:10px 13px;font-size:15px}
.cart{position:fixed;bottom:0;left:0;right:0;background:#244c36;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}
.cart button{background:#f0dca1;color:#24352a;border:0;border-radius:10px;padding:11px 15px;font-weight:bold}
#cartList{background:white;border-radius:14px;padding:12px;margin:12px 0;display:none}
select,input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:9px;font-size:16px}
.send{width:100%;padding:14px;border:0;border-radius:10px;background:#244c36;color:white;font-size:17px}
</style>
</head>
<body>
<header>
<div class="logo">🍵</div>
<h1>আড্ডা রাজ</h1>
<p>বসুন, অর্ডার করুন, আড্ডা দিন</p>
</header>

<div class="hero">
<h2>স্বাগতম আড্ডা রাজে! 🌿</h2>
<p>এক কাপ চা, মজার নাস্তা আর জমিয়ে আড্ডা—আপনার সময়টা হোক সুন্দর।</p>
</div>

<section class="section">
<h2>🍽️ আমাদের মেনু</h2>
<div class="categories">
<button class="chip active" onclick="filterMenu('সব',this)">সব</button>
<button class="chip" onclick="filterMenu('চা',this)">চা</button>
<button class="chip" onclick="filterMenu('নাস্তা',this)">নাস্তা</button>
<button class="chip" onclick="filterMenu('ফাস্ট ফুড',this)">ফাস্ট ফুড</button>
</div>

<div id="menu"><p>মেনু লোড হচ্ছে...</p></div>

<div id="cartList">
<h3>আপনার কার্ট</h3>
<div id="cartItems"></div>
<label for="table">টেবিল নম্বর</label>
<select id="table">
<option value="">টেবিল নির্বাচন করুন</option>
<option value="1">টেবিল ১</option>
<option value="2">টেবিল ২</option>
<option value="3">টেবিল ৩</option>
<option value="4">টেবিল ৪</option>
<option value="5">টেবিল ৫</option>
</select>
<input id="customer" placeholder="আপনার নাম (ঐচ্ছিক)">
<textarea id="note" placeholder="বিশেষ নির্দেশনা (ঐচ্ছিক)"></textarea>
<button class="send" onclick="placeOrder()">অর্ডার পাঠান</button>
<p id="message"></p>
</div>
</section>

<div class="cart">
<div>🛒 <span id="count">০</span> আইটেম · ৳<span id="total">০</span></div>
<button onclick="openCart()">কার্ট দেখুন</button>
</div>

<script>
const SUPABASE_URL = "এখানে_তোমার_Supabase_Project_URL";
const SUPABASE_KEY = "এখানে_তোমার_Supabase_Publishable_Key";

let products = [
{id:1,name:"মাসালা চা",category:"চা",description:"মসলার সুগন্ধযুক্ত গরম চা",price:30,emoji:"🍵"},
{id:2,name:"দুধ চা",category:"চা",description:"মজাদার দুধ চা",price:20,emoji:"☕"},
{id:3,name:"সিঙ্গারা",category:"নাস্তা",description:"মুচমুচে আলুর সিঙ্গারা",price:15,emoji:"🥟"},
{id:4,name:"সমুচা",category:"নাস্তা",description:"মজাদার সমুচা",price:20,emoji:"🥠"},
{id:5,name:"চিকেন স্যান্ডউইচ",category:"ফাস্ট ফুড",description:"সুস্বাদু চিকেন স্যান্ডউইচ",price:80,emoji:"🥪"}
];
let cart = {};

function renderMenu(category="সব"){
const list = document.getElementById("menu");
const shown = products.filter(p=>category==="সব"||p.category===category);
list.innerHTML = shown.map(p=>`
<div class="item">
<div class="food">${p.emoji}</div>
<div class="details"><h3>${p.name}</h3>
<p>${p.description}</p>
<div class="price">৳${p.price}</div></div>
<button class="add" onclick="addItem(${p.id})">+ যোগ</button>
</div>`).join("");
}
function filterMenu(category,button){
document.querySelectorAll(".chip").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
renderMenu(category);
}
function addItem(id){
cart[id]=(cart[id]||0)+1;
updateCart();
}
function updateCart(){
let count=0,total=0;
document.getElementById("cartItems").innerHTML=products.filter(p=>cart[p.id]).map(p=>{
count+=cart[p.id];total+=p.price*cart[p.id];
return `<p>${p.name} × ${cart[p.id]} — ৳${p.price*cart[p.id]}
<button onclick="changeQty(${p.id},-1)">−</button>
<button onclick="changeQty(${p.id},1)">+</button></p>`;
}).join("");
document.getElementById("count").textContent=count;
document.getElementById("total").textContent=total;
}
function changeQty(id,delta){
cart[id]=(cart[id]||0)+delta;
if(cart[id]<=0)delete cart[id];
updateCart();
}
function openCart(){
document.getElementById("cartList").style.display="block";
document.getElementById("cartList").scrollIntoView({behavior:"smooth"});
}
async function placeOrder(){
const message=document.getElementById("message");
if(!Object.keys(cart).length){message.textContent="আগে খাবার কার্টে যোগ করুন।";return;}
const table=document.getElementById("table").value;
if(!table){message.textContent="টেবিল নম্বর নির্বাচন করুন।";return;}
if(SUPABASE_URL.includes("এখানে_")||SUPABASE_KEY.includes("এখানে_")){
message.textContent="ওয়েবসাইটের ডেটাবেজ সংযোগ এখনো সেটআপ করা হয়নি।";
return;
}
message.textContent="অর্ডার পাঠানো হচ্ছে...";
const items=products.filter(p=>cart[p.id]);
const total=items.reduce((sum,p)=>sum+p.price*cart[p.id],0);
try{
const headers={"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Prefer":"return=representation"};
const res=await fetch(SUPABASE_URL+"/rest/v1/orders",{method:"POST",headers,body:JSON.stringify({table_number:Number(table),customer_name:document.getElementById("customer").value,note:document.getElementById("note").value,total,status:"নতুন"})});
if(!res.ok)throw new Error(await res.text());
const order=(await res.json())[0];
const rows=items.map(p=>({order_id:order.id,menu_item_id:p.id,menu_name:p.name,quantity:cart[p.id],unit_price:p.price}));
const r2=await fetch(SUPABASE_URL+"/rest/v1/order_items",{method:"POST",headers,body:JSON.stringify(rows)});
if(!r2.ok)throw new Error(await r2.text());
message.textContent="অর্ডার গ্রহণ করা হয়েছে! অর্ডার নম্বর: "+order.id+"। টাকা ক্যাফেতে সরাসরি পরিশোধ করুন।";
cart={};updateCart();
}catch(e){message.textContent="অর্ডার পাঠানো যায়নি। ডেটাবেজের অনুমতি ও সংযোগ পরীক্ষা করতে হবে।";console.error(e);}
}
renderMenu();
</script>
</body>
</html>
